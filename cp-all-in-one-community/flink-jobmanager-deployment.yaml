apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.35.0 (9532ceef3)
  labels:
    io.kompose.service: flink-jobmanager
  name: flink-jobmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: flink-jobmanager
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.35.0 (9532ceef3)
      labels:
        io.kompose.service: flink-jobmanager
    spec:
      containers:
        - args:
            - jobmanager
          env:
            - name: FLINK_PROPERTIES
              value: |2
                jobmanager.rpc.address: flink-jobmanager
                rest.bind-port: 9081
          image: cnfldemos/flink-kafka:1.19.1-scala_2.12-java17
          name: flink-jobmanager
          ports:
            - containerPort: 9081
              protocol: TCP
      hostname: flink-jobmanager
      restartPolicy: Always
