apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.35.0 (9532ceef3)
  labels:
    io.kompose.service: flink-sql-client
  name: flink-sql-client
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: flink-sql-client
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.35.0 (9532ceef3)
      labels:
        io.kompose.service: flink-sql-client
    spec:
      containers:
        - env:
            - name: FLINK_JOBMANAGER_HOST
              value: flink-jobmanager
          image: cnfldemos/flink-sql-client-kafka:1.19.1-scala_2.12-java17
          name: flink-sql-client
      hostname: flink-sql-client
      restartPolicy: Always
